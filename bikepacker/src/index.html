<!DOCTYPE html>
<html>
  <head>
    <title>BikePacker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      #container {
        display: flex;
        height: 100%;
      }
      #map-container {
        flex: 8; /* Adjusted flex ratio */
        height: 100%; /* Left two-thirds */
        position: relative; /* For absolute positioning of slider-container */
      }
      #map {
        width: 100%;
        height: 100%;
      }
      #controls-container {
        flex: 2; /* Adjusted flex ratio */
        padding: 20px;
        box-sizing: border-box;
        background-color: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: flex-start; /* Align items to the top */
      }
      #upload-section {
        width: 100%;
        margin-bottom: 20px;
      }
      #gpx-select {
        width: 100%; /* Make dropdown take full width */
        padding: 5px;
        font-size: 1em;
      }
      #altitude-chart-container {
        position: absolute;
        bottom: 30px; /* Positioned above the slider (slider is at 30px, allow ~50px for slider height + spacing) */
        left: 20px; /* Consistent padding with slider */
        width: calc(100% - 40px); /* Full width minus padding */
        height: 100px; /* Fixed height for the chart area */
        padding: 10px; /* Padding inside the chart container */
        background-color: rgba(
          255,
          255,
          255,
          0.9
        ); /* Semi-transparent white background */
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        z-index: 1000; /* Ensure it's above map tiles but below modals if any */
        box-sizing: border-box;
        display: none; /* Initially hidden, shown by JS when track loads */
      }
      #altitude-chart {
        width: 100%;
        height: 100%;
      }
      #track-slider {
        width: 100%;
        cursor: pointer;
      }
      .track-dot-icon {
        /* Custom styling for the moving dot */
        background-color: #ff4500; /* OrangeRed */
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.3);
      }
      .stops-list {
        list-style-type: none;
        padding: 0;
        margin: 0;
        width: 100%;
      }
      .stops-list li a {
        display: block;
        padding: 8px 12px;
        text-decoration: none;
        color: #007bff;
        background-color: #fff;
        border-bottom: 1px solid #ddd;
        transition: background-color 0.2s;
      }
      .stops-list li a:hover {
        background-color: #e9ecef;
      }
      .stop-description {
        padding: 4px 12px 10px 12px;
        font-size: 0.9em;
        color: #666;
        background-color: #fff;
      }
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.8);
        z-index: 2000; /* High z-index to be on top */
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .spinner {
        border: 8px solid #f3f3f3; /* Light grey */
        border-top: 8px solid #3498db; /* Blue */
        border-radius: 50%;
        width: 60px;
        height: 60px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="map-container">
        <div id="map"></div>
        <div id="loading-overlay" style="display: none;">
          <div class="spinner"></div>
        </div>
        <div id="altitude-chart-container">
          <canvas id="altitude-chart"></canvas>
          <input type="range" id="track-slider" min="0" max="100" value="0" />
        </div>
      </div>
      <div id="controls-container">
        <div id="upload-section">
          <select id="gpx-select" title="Select a track"></select>
        </div>
        <div id="track-details-container">
          <!-- Details from route.json will be inserted here by map.js -->
        </div>
      </div>
    </div>
    <script type="module" src="map.js"></script>
  </body>
</html>
      }
    </style>

  </body>
</html>
