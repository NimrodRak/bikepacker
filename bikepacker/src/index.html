<!DOCTYPE html>
<html>
  <head>
    <title>BikePacker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚲</text></svg>"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
          "Segoe UI Symbol";
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background-color: #f4f7f6;
      }
      h1 {
        font-size: 3em;
        color: #333;
        margin-bottom: 0.5em;
      }

      #gpx-select {
        min-width: 300px;
        padding: 12px;
        font-size: 1.2em;
        border-radius: 8px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h1>BikePacker</h1>
    <select id="gpx-select" title="Select a track"></select>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const gpxSelect = document.getElementById("gpx-select");

        // Fetch GPX files and populate the dropdown
        fetch("/api/gpx-files")
          .then((response) => response.json())
          .then((files) => {
            gpxSelect.innerHTML = '<option value="">Select a track...</option>'; // Default option
            files.forEach((file) => {
              const option = document.createElement("option");
              option.value = file;
              option.textContent = file;
              gpxSelect.appendChild(option);
            });
          })
          .catch((error) => {
            gpxSelect.innerHTML =
              '<option value="">Could not load tracks</option>';
          });

        // Event listener for the dropdown to navigate to the track page
        gpxSelect.addEventListener("change", function () {
          const selectedTrackName = this.value;
          if (selectedTrackName) {
            // Navigate to the new page
            window.location.href = `/${encodeURIComponent(selectedTrackName)}`;
          }
        });
      });
    </script>
  </body>
</html>
